[tool.ruff]
# Set the minimum Python version to target
# See https://docs.astral.sh/ruff/settings/#target-version for a list of all available versions
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules for a list of all available rules

# Add "I", "Q" and "UP" to the list of enabled rules
# select = ["E4", "E7", "E9", "F", "I", "Q", "UP"]
# ignore = ["COM812"]

select = ["ALL"]
ignore = [
    "D1",     # Missing docstring
    "ANN",    # flake8-annotations
    "S101",   # Use of assert detected
    "T201",   # print found
    "COM812", # Trailing comma missing
    "TRY400", # Use logging.exception instead of logging.error
    "TRY300", # Checks for return statements in try blocks.
    "RUF012", # Checks for mutable default values in class attributes

    "BLE001", # Do not catch blind exception: `Exception`

    "PTH103", # `os.makedirs()` should be replaced by `Path.mkdir(parents=True)`
    "PTH110", # `os.path.exists()` should be replaced by `Path.exists()`
    "PTH118", # `os.path.join()` should be replaced by `Path` with `/` operator
    "PTH119", # `os.path.basename()` should be replaced by `Path.name`
    "PTH122", # `os.path.splitext()` should be replaced by `Path.suffix`, `Path.stem`, and `Path.parent`
    "PTH123", # `open()` should be replaced by `Path.open()`
    "PTH202", # `os.path.getsize` should be replaced by `Path.stat().st_size`

    "DTZ005", # `datetime.datetime.now()` called without a `tz` argument

    "D203", # Keep D211 instead (no blank line before class docstring)
    "D213", # Keep D212 instead (summary on first line)

    "E501", # Line too long (use line-length to configure maximum allowed line length)

    "I", # Please, do not fight isort, ruff! Just don't.
]
