# use the xterm-256color terminal
set -g default-terminal "screen-256color"

# apply Tc
set-option -ga terminal-overrides ",xterm-256color:Tc"

# use the terminal palette, not the dimmer built-in theme colours of tmux 3.8
set -g theme terminal

# let the visible pane send notifications and progress to the terminal
set -g allow-passthrough on
# tell programs when their pane or the terminal gains or loses focus
set -g focus-events on
# pass keys like Shift+Enter to programs that ask, instead of plain Enter
set -s extended-keys on
# assume the terminal can send those keys; tmux 3.8 detects Ghostty anyway
set -as terminal-features 'xterm*:extkeys'

# shell
# set-option -g default-shell /usr/local/bin/fish
set-option -g default-shell /opt/homebrew/bin/fish

# mouse
set -g mouse on

# clipboard integration
set -g set-clipboard on

# vi mode for window navigation
set-window-option -g mode-keys vi

# window title
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# tmux 3.8 underlines the current window by default
setw -g window-status-current-style default
setw -g window-status-activity-style default
setw -g monitor-activity on

# bell-flagged window title (Claude Code Stop hook rings the bell)
setw -g window-status-bell-style bold

# border color
set -g pane-border-style 'fg=#5a5a5a'
set -g pane-active-border-style 'fg=#a8b946,bg=default'
set -g display-panes-colour '#a8b946'
set -g display-panes-active-colour '#d7ff00'
set -g clock-mode-colour '#a8b946'
set -g mode-style 'bg=#a8b946,fg=black'
set -g message-style 'bg=#a8b946,fg=black'
set -g message-command-style 'bg=#323328,fg=#a8b946'
set -g menu-selected-style 'bg=#a8b946,fg=black'
set -g menu-border-style 'fg=#a8b946'
set -g pane-border-lines double  # single double heavy simple number
set -g pane-border-status top
set -g pane-border-indicators arrows
set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] #{pane_current_command} "#{pane_title}"#{?pane_synchronized, SYNC,}#[align=right]#{pane_width}x#{pane_height}'


# binds for pane
bind -r -N "Select the pane above (repeat)" k select-pane -U
bind -r -N "Select the pane below (repeat)" j select-pane -D
bind -r -N "Select the pane to the left (repeat)" h select-pane -L
bind -r -N "Select the pane to the right (repeat)" l select-pane -R

# short cuts to select pane
bind-key -n -N "Show pane numbers" C-S-End display-panes -d 500
bind-key -n -N "Select the pane above" C-S-Up select-pane -U
bind-key -n -N "Select the pane below" C-S-Down select-pane -D
bind-key -n -N "Select the pane to the right" C-S-Right select-pane -R
bind-key -n -N "Select the pane to the left" C-S-Left select-pane -L

# short cuts to select window
bind-key -n -N "Previous window" S-M-Up select-window -p
bind-key -n -N "Next window" S-M-Down select-window -n
bind-key -n -N "Next window" S-M-Right select-window -n
bind-key -n -N "Previous window" S-M-Left select-window -p
bind-key -n -N "Previous window" S-Up select-window -p
bind-key -n -N "Next window" S-Down select-window -n
bind-key -n -N "Last used window" C-Tab last-window
# Claude Code, a process named after its version, redraws its whole conversation
# on Ctrl+L, so it gets none
bind-key -n -N "Clear the pane and its history (Cmd+K)" C-M-k { send-keys -R ; clear-history ; if -F '#{m:[0-9]*,#{pane_current_command}}' {} { send-keys C-l } }
bind-key -n -N "Menu of all windows" C-BTab run-shell -b "~/bin/tmux-window-menu"
bind-key -n -N "Window 1" C-1 select-window -t :1
bind-key -n -N "Window 2" C-2 select-window -t :2
bind-key -n -N "Window 3" C-3 select-window -t :3
bind-key -n -N "Window 4" C-4 select-window -t :4
bind-key -n -N "Window 5" C-5 select-window -t :5
bind-key -n -N "Window 6" C-6 select-window -t :6
bind-key -n -N "Window 7" C-7 select-window -t :7
bind-key -n -N "Window 8" C-8 select-window -t :8
bind-key -n -N "Window 9" C-9 select-window -t :9
bind-key -n -N "Window 0" C-0 select-window -t :0

# broadcast on/off
bind -N "Type in all panes of the window at once" a setw synchronize-panes
setw -g window-status-format         '#[fg=#292929,bg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}}]#[fg=#{?@flash,black,#{?window_bell_flag,white,#{?window_activity_flag,#e4f24d,#292929}}},bg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}}]#I#{?#{==:#{@claude},busy},⦁,#{?@claude,⚬,◦}}#{?window_zoomed_flag,#[dotted-underscore],}#W#{?window_zoomed_flag,#[nodotted-underscore],}#[fg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}},bg=#292929]'
setw -g window-status-current-format '#[fg=#292929,bg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}}]#[fg=#{?window_bell_flag,white,black},bg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}}]#I#{?#{==:#{@claude},busy},⦁,#{?@claude,⚬,◦}}#{?window_zoomed_flag,#[dotted-underscore],}#W#{?window_zoomed_flag,#[nodotted-underscore],}#[fg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}},bg=#292929]'

# plugins

## thumbs (https://github.com/fcsonline/tmux-thumbs)
set -g @thumbs-key v
set -g @thumbs-command 'echo -n {} | tmux load-buffer -bxclip -; tmux paste-buffer -bxclip -d'
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'
set -g @thumbs-unique enabled
set -g @thumbs-position right
set -g @thumbs-bg-color blue
set -g @thumbs-regexp-1 '([A-Za-z0-9/\._-]+:[1-9][0-9]+:[1-9][0-9]+)' # file.ext:line:column
set -g @thumbs-regexp-2 '([A-Za-z0-9/\._-]+:[1-9][0-9]+)' # file.ext:line
# prefix+u: the same hints, but the picked text is opened, e.g. a link in the browser
bind -N "Pick a link or file on screen and open it" u run-shell -b -c "#{pane_current_path}" "~/.tmux/plugins/tmux-thumbs/target/release/tmux-thumbs --dir ~/.tmux/plugins/tmux-thumbs --command 'open \"{}\"' --upcase-command 'open \"{}\"' || true"


# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-space
unbind-key C-b
bind-key -N "Send the prefix to the program" C-space send-prefix

# Set new panes to open in current directory
bind -N "Split down, same folder" '"' split-window -c "#{pane_current_path}"
bind -N "Split right, same folder" % split-window -h -c "#{pane_current_path}"

# Set new windows to also open in current directory
bind -N "New window, same folder" c new-window -c "#{pane_current_path}"

# Set more intuitive window split shortcut
bind -N "Split left, same folder" | split-window -hb -c "#{pane_current_path}"
bind -N "Split right, same folder" \\ split-window -h -c "#{pane_current_path}"
bind -N "Split up, same folder" _ split-window -vb -c "#{pane_current_path}"
bind -N "Split down, same folder" - split-window -v -c "#{pane_current_path}"

# Fade unfocused panes out
set -g window-style fg=colour242
set -g window-active-style fg=colour246

bind-key -T copy-mode -N "Start a selection" C-B send-keys -X begin-selection
bind-key -T copy-mode -N "Copy the selection" Enter send-keys -X copy-selection
# releasing a mouse selection copies it but stays in copy mode, where you scrolled to,
# for 1 second; another selection or scrolling restarts the countdown
bind-key -T copy-mode -N "Copy a mouse selection, stay in copy mode for 1 s" MouseDragEnd1Pane 'send-keys -X copy-pipe-no-clear ; run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1"'
bind-key -T copy-mode-vi -N "Copy a mouse selection, stay in copy mode for 1 s" MouseDragEnd1Pane 'send-keys -X copy-pipe-no-clear ; run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1"'
bind-key -T copy-mode -N "Scroll up 5 lines" WheelUpPane 'select-pane ; send-keys -X -N 5 scroll-up ; if-shell -F "#{@copy_timer}" { run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1" }'
bind-key -T copy-mode-vi -N "Scroll up 5 lines" WheelUpPane 'select-pane ; send-keys -X -N 5 scroll-up ; if-shell -F "#{@copy_timer}" { run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1" }'
bind-key -T copy-mode -N "Scroll down 5 lines" WheelDownPane 'select-pane ; send-keys -X -N 5 scroll-down ; if-shell -F "#{@copy_timer}" { run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1" }'
bind-key -T copy-mode-vi -N "Scroll down 5 lines" WheelDownPane 'select-pane ; send-keys -X -N 5 scroll-down ; if-shell -F "#{@copy_timer}" { run-shell -b "~/bin/tmux-copy-timeout #{pane_id} 1" }'

# Ctrl+Alt+Up/Down: jump to the previous/next shell prompt
bind-key -n -N "Jump to the previous shell prompt" C-M-Up 'copy-mode ; send-keys -X previous-prompt'
bind-key -n -N "Jump to the next shell prompt" C-M-Down 'copy-mode ; send-keys -X next-prompt'
bind-key -T copy-mode-vi -N "Jump to the previous shell prompt" C-M-Up send-keys -X previous-prompt
bind-key -T copy-mode-vi -N "Jump to the next shell prompt" C-M-Down send-keys -X next-prompt

bind -N "Clear the screen" l send-keys -R

# Swap adjacent windows
bind-key -n -N "Move the window left" S-PageUp swap-window -t -1 \; select-window -t -1
bind-key -n -N "Move the window right" S-PageDown swap-window -t +1 \; select-window -t +1

# Ctrl+Alt+Left/Right: cycle to previous/next pane
bind -n -N "Next pane" S-C-M-Right select-pane -t :.+
bind -n -N "Previous pane" S-C-M-Left select-pane -t :.-

# prefix+A: jump to the next window with an alert (e.g. a bell-flagged Claude window)
bind -N "Next window with activity" A next-window -a

# prefix+b: toggle back and forth with the last window, non-sequential
bind -N "Last used window" b last-window

# prefix+backspace: menu of live Claude Code sessions, pick one to jump to it
bind -N "Menu of Claude sessions" BSpace run-shell -b "bash ~/.claude/claude-menu.sh"

# prefix+R: the Claude in this pane may only read; ~/.claude/claude-readonly.sh checks the
# pane option (from Michael Borisov's dotfiles, https://github.com/SecTedd/dotfiles, MIT)
bind -N "Read-only Claude in this pane (toggle)" R if -F '#{@claude_readonly}' {
  set -pu @claude_readonly
  display-message 'Read-only Claude: off'
} {
  set -p @claude_readonly 1
  display-message 'Read-only Claude: on'
}

# live Claude Code sessions (● busy / ○ idle) ahead of the default pane title + clock
set -g status-right-length 120
set -g status-style 'bg=#292929,fg=white'
set -g status-left '#[fg=#292929,bg=#616932] #S #[fg=#616932,bg=#292929]'
# claude-fleet.sh also refreshes the busy/idle mark of the window capsules
set -g status-interval 2
bind-key -n -N "Jump to a Claude session or window" MouseDown1Status if-shell -F '#{m:%*,#{mouse_status_range}}' { run-shell 'tmux switch-client -t "#{mouse_status_range}"' } { switch-client -t = }
set -g status-right '#(bash ~/.claude/claude-fleet.sh)#[fg=#292929,bg=#616932]#[fg=#292929,bg=#616932] %H:%M %d-%b-%y'
set -g window-status-separator ''
