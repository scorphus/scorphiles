# use the xterm-256color terminal
set -g default-terminal "screen-256color"

# apply Tc
set-option -ga terminal-overrides ",xterm-256color:Tc"

# use the terminal palette, not the dimmer built-in theme colours of tmux 3.8
set -g theme terminal

# shell
# set-option -g default-shell /usr/local/bin/fish
set-option -g default-shell /opt/homebrew/bin/fish

# mouse
set -g mouse on

# clipboard integration
set -g set-clipboard on

# vi mode for window navigation
set-window-option -g mode-keys vi

# window title
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# tmux 3.8 underlines the current window by default
setw -g window-status-current-style default
setw -g window-status-activity-style default
setw -g monitor-activity on

# bell-flagged window title (Claude Code Stop hook rings the bell)
setw -g window-status-bell-style bold

# border color
set -g pane-border-style 'fg=#5a5a5a'
set -g pane-active-border-style 'fg=#a8b946,bg=default'
set -g display-panes-colour '#a8b946'
set -g display-panes-active-colour '#d7ff00'
set -g clock-mode-colour '#a8b946'
set -g mode-style 'bg=#a8b946,fg=black'
set -g message-style 'bg=#a8b946,fg=black'
set -g message-command-style 'bg=#323328,fg=#a8b946'
set -g pane-border-lines double  # single double heavy simple number
set -g pane-border-status top
set -g pane-border-indicators arrows
set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] #{pane_current_command} "#{pane_title}"#{?window_zoomed_flag, Z,}#{?pane_synchronized, SYNC,}#[align=right]#{pane_width}x#{pane_height}'


# binds for pane
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# short cuts to select pane
bind-key -n C-S-End display-panes -d 500
bind-key -n C-S-Up select-pane -U
bind-key -n C-S-Down select-pane -D
bind-key -n C-S-Right select-pane -R
bind-key -n C-S-Left select-pane -L

# short cuts to select window
bind-key -n S-M-Up select-window -p
bind-key -n S-M-Down select-window -n
bind-key -n S-M-Right select-window -n
bind-key -n S-M-Left select-window -p
bind-key -n S-Up select-window -p
bind-key -n S-Down select-window -n

# broadcast on/off
bind a setw synchronize-panes
setw -g window-status-format         '#[fg=#272820,bg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}}]#[fg=#{?@flash,black,#{?window_bell_flag,white,#{?window_activity_flag,#e4f24d,#272820}}},bg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}}]#I·#W#{?window_zoomed_flag, Z,}#[fg=#{?@flash,#d1e467,#{?window_bell_flag,red,#{?pane_synchronized,magenta,#616932}}},bg=#272820]'
setw -g window-status-current-format '#[fg=#272820,bg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}}]#[fg=#{?window_bell_flag,white,black},bg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}}]#I·#W#{?window_zoomed_flag, Z,}#[fg=#{?window_bell_flag,red,#{?@flash,#d1e467,#{?pane_synchronized,fuchsia,#b8cb4d}}},bg=#272820]'

# plugins

## thumbs (https://github.com/fcsonline/tmux-thumbs)
set -g @thumbs-key v
set -g @thumbs-command 'echo -n {} | tmux load-buffer -bxclip -; tmux paste-buffer -bxclip -d'
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
set -g @thumbs-upcase-command 'echo -n {} | pbcopy'
set -g @thumbs-unique enabled
set -g @thumbs-position right
set -g @thumbs-bg-color blue
set -g @thumbs-regexp-1 '([A-Za-z0-9/\._-]+:[1-9][0-9]+:[1-9][0-9]+)' # file.ext:line:column
set -g @thumbs-regexp-2 '([A-Za-z0-9/\._-]+:[1-9][0-9]+)' # file.ext:line


# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Set new windows to also open in current directory
bind c new-window -c "#{pane_current_path}"

# Set more intuitive window split shortcut
bind | split-window -hb -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind _ split-window -vb -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Fade unfocused panes out
set -g window-style fg=colour242
set -g window-active-style fg=colour246

bind-key -T copy-mode C-B send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-selection

bind l send-keys -R

# Swap adjacent windows
bind-key -n S-PageUp swap-window -t -1 \; select-window -t -1
bind-key -n S-PageDown swap-window -t +1 \; select-window -t +1

# Ctrl+Alt+Left/Right: cycle to previous/next pane
bind -n S-C-M-Right select-pane -t :.+
bind -n S-C-M-Left select-pane -t :.-

# prefix+A: jump to the next window with an alert (e.g. a bell-flagged Claude window)
bind A next-window -a

# prefix+b: toggle back and forth with the last window, non-sequential
bind b last-window

# prefix+backspace: menu of live Claude Code sessions, pick one to jump to it
bind BSpace run-shell -b "bash ~/.claude/claude-menu.sh"

# live Claude Code sessions (● busy / ○ idle) ahead of the default pane title + clock
set -g status-right-length 120
set -g status-style 'bg=#272820,fg=white'
set -g status-left '#[fg=#272820,bg=#616932] #S #[fg=#616932,bg=#272820]'
set -g status-right '#(bash ~/.claude/claude-fleet.sh)#[fg=#272820,bg=#616932]#[fg=#272820,bg=#616932] %H:%M %d-%b-%y'
set -g window-status-separator ''
