<!doctype html>
<!-- shortcut panel, from Michael Borisov's dotfiles
     https://github.com/SecTedd/dotfiles

     Licensed under the MIT license:
     http://www.opensource.org/licenses/mit-license
     Copyright (c) 2026 Michael Borisov -->
<!-- The shortcut panel's window content (modules/panel.lua loads it into an
     hs.webview). Lua <-> JS:
       Lua -> JS   panelSetEntries(entries)   all entries for this opening
                   panelSetResults(indices)   entries to show, in rank order
                   panelShow()                reset the query, focus the field
       JS -> Lua   postMessage({ action: "query", text })
                   postMessage({ action: "run", index })
                   postMessage({ action: "close" })
     Sizes come from Lua (__ROW_H__ etc. are replaced before loading), so the
     window frame and the layout agree without measuring anything at run time. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    /* the greens of the tmux status bar */
    --base: #292929; --mantle: #222222; --surface0: #3a3c30; --surface1: #616932;
    --text: #e4e4dc; --subtext0: #b8b9ad; --overlay1: #8b8d80; --overlay0: #6f7166;
    --blue: #a8b946; --lavender: #d1e467; --mauve: #b8cb4d;
    --margin: __MARGIN__px; --row-h: __ROW_H__px; --header-h: __HEADER_H__px; --footer-h: __FOOTER_H__px;
    --width: __CARD_W__px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: "JetBrainsMono Nerd Font", monospace;
    font-size: 14px; color: var(--text);
    padding: var(--margin); /* room for the shadow */
    -webkit-user-select: none; user-select: none;
  }
  .card {
    width: var(--width);
    background: var(--base);
    border: 1px solid var(--surface1);
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    opacity: 0; transform: scale(0.985);
    transition: opacity 100ms ease-out, transform 100ms ease-out;
  }
  .card.visible { opacity: 1; transform: none; }

  /* Search field: compact, Spotlight-like */
  .header {
    height: var(--header-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--surface0);
  }
  .header .icon { color: var(--overlay1); font-size: 15px; }
  #query {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    font: inherit; font-size: 16px; color: var(--text);
    caret-color: var(--mauve);
  }
  #query::placeholder { color: var(--overlay0); }
  #count { color: var(--overlay1); font-size: 12px; white-space: nowrap; }

  /* Results: the height follows the number of rows (max __MAX_ROWS__), animated */
  #list {
    height: 0;
    overflow-y: auto; overflow-x: hidden;
    transition: height 120ms ease-out;
  }
  .row {
    height: var(--row-h);
    display: flex; align-items: center; gap: 14px;
    padding: 0 16px;
    cursor: default;
    white-space: nowrap;
  }
  .row:hover { background: var(--mantle); }
  .row.selected { background: var(--surface0); }
  .row .key {
    flex: 0 0 13ch;
    color: var(--blue);
    display: flex; align-items: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .row.selected .key { color: var(--lavender); }
  .row .key img { width: 16px; height: 16px; }
  /* template icons take the key color (via a mask), like the glyphs in the text */
  .row .key .template {
    display: inline-block; width: 16px; height: 16px; background: currentColor;
    -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
  }
  .row .desc { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .group { flex: 0 0 auto; color: var(--overlay1); font-size: 12px; }
  .row.selected .group { color: var(--subtext0); }
  .empty { height: var(--row-h); display: flex; align-items: center; padding: 0 16px; color: var(--overlay1); }

  .footer {
    height: var(--footer-h);
    display: flex; align-items: center; justify-content: flex-end; gap: 18px;
    padding: 0 16px;
    border-top: 1px solid var(--surface0);
    color: var(--overlay1); font-size: 12px;
  }
  .footer kbd { color: var(--subtext0); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="header">
    <span class="icon"></span>
    <input id="query" type="text" placeholder="Search shortcuts" autocomplete="off" spellcheck="false">
    <span id="count"></span>
  </div>
  <div id="list"></div>
  <div class="footer">
    <span><kbd>⌃J</kbd> <kbd>⌃K</kbd> move</span>
    <span><kbd>⏎</kbd> run</span>
    <span><kbd>Esc</kbd> close</span>
  </div>
</div>
<script>
  "use strict";
  const ROW_H = __ROW_H__;
  const MAX_ROWS = __MAX_ROWS__;

  const card = document.getElementById("card");
  const list = document.getElementById("list");
  const query = document.getElementById("query");
  const count = document.getElementById("count");

  let entries = [];   // all entries, by index (1-based from Lua)
  let results = [];   // indices currently shown, in rank order
  let selected = 0;   // position in results

  const post = (msg) => window.webkit.messageHandlers.panel.postMessage(msg);

  // Lua -> JS -----------------------------------------------------------------
  window.panelSetEntries = (list) => {
    entries = [];
    for (const e of list) entries[e.index] = e;
  };

  window.panelSetResults = (indices) => {
    results = indices;
    selected = 0;
    render();
  };

  // Open: the card fades in with the search field, then the list grows to its height
  window.panelShow = () => {
    query.value = "";
    query.focus();
    withoutTransition(list, () => { list.style.height = "0px"; });
    card.classList.add("visible");
    requestAnimationFrame(() => requestAnimationFrame(() => { list.style.height = listHeight + "px"; }));
  };

  // Close: reset instantly, so the next open starts from an invisible card
  window.panelHide = () => {
    withoutTransition(card, () => card.classList.remove("visible"));
  };

  function withoutTransition(element, change) {
    element.style.transition = "none";
    change();
    void element.offsetHeight; // apply now, before the transition comes back
    element.style.transition = "";
  }

  let listHeight = 0; // px, for the number of rows shown (max MAX_ROWS)

  // Rendering -----------------------------------------------------------------
  function render() {
    const fragment = document.createDocumentFragment();
    results.forEach((index, position) => {
      const e = entries[index];
      const row = document.createElement("div");
      row.className = "row" + (position === selected ? " selected" : "");
      row.dataset.position = position;

      const key = document.createElement("span");
      key.className = "key";
      key.appendChild(document.createTextNode(e.key));
      if (e.icon && e.iconTemplate) {
        const icon = document.createElement("span");
        icon.className = "template";
        icon.style.webkitMaskImage = "url(" + e.icon + ")";
        key.appendChild(icon);
      } else if (e.icon) {
        const img = document.createElement("img");
        img.src = e.icon;
        key.appendChild(img);
      }

      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = e.description;

      const group = document.createElement("span");
      group.className = "group";
      group.textContent = e.group;

      row.append(key, desc, group);
      fragment.appendChild(row);
    });
    if (results.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No matching shortcut";
      fragment.appendChild(empty);
    }
    list.replaceChildren(fragment);
    listHeight = Math.max(1, Math.min(results.length, MAX_ROWS)) * ROW_H;
    list.style.height = listHeight + "px";
    count.textContent = results.length + " / " + Math.max(0, entries.length - 1);
    list.scrollTop = 0;
  }

  function select(position) {
    if (results.length === 0) return;
    position = Math.max(0, Math.min(results.length - 1, position));
    if (position === selected) return;
    list.children[selected]?.classList.remove("selected");
    selected = position;
    const row = list.children[selected];
    row.classList.add("selected");
    row.scrollIntoView({ block: "nearest" });
  }

  function run(position) {
    const index = results[position];
    if (index !== undefined) post({ action: "run", index });
  }

  // Input ---------------------------------------------------------------------
  query.addEventListener("input", () => post({ action: "query", text: query.value }));

  document.addEventListener("keydown", (event) => {
    const ctrl = event.ctrlKey && !event.metaKey && !event.altKey;
    const k = event.key;
    if (k === "ArrowDown" || (ctrl && (k === "j" || k === "n"))) { select(selected + 1); }
    else if (k === "ArrowUp" || (ctrl && (k === "k" || k === "p"))) { select(selected - 1); }
    else if (k === "PageDown" || (ctrl && k === "J")) { select(selected + MAX_ROWS); }
    else if (k === "PageUp" || (ctrl && k === "K")) { select(selected - MAX_ROWS); }
    else if (k === "Enter") { run(selected); }
    else if (k === "Escape") { post({ action: "close" }); }
    else return; // anything else goes to the search field
    event.preventDefault();
  });

  list.addEventListener("click", (event) => {
    const row = event.target.closest(".row");
    if (row) run(Number(row.dataset.position));
  });

  // Keep the field focused: a click anywhere else in the card gives it back
  document.addEventListener("mousedown", (event) => {
    if (event.target !== query) { event.preventDefault(); query.focus(); }
  });
</script>
</body>
</html>
